name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: jactionlint zizmor shellcheck
      # jactionlint, shellcheck and zizmor, the same as `mise run lint` locally.
      # zizmor's online audits (impostor commits, stale pins) read the GitHub
      # API, so it gets the read-only token.
      - run: mise run lint
        env:
          GH_TOKEN: ${{ github.token }}
