name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint zizmor shellcheck
      # actionlint, shellcheck and zizmor, the same as `mise run lint` locally.
      # zizmor's online audits (impostor commits, stale pins) read the GitHub
      # API, so it gets the read-only token.
      - run: mise run lint
        env:
          GH_TOKEN: ${{ github.token }}
