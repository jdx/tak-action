context = """
tak-action is a GitHub composite action for tak (https://github.com/jdx/tak), a CLI that
measures how much work a command does by counting retired instructions with valgrind's
cachegrind, and stores results in the repository as git notes under refs/notes/tak. The action
installs tak and valgrind, records main-branch measurements, compares a pull request with its
merge base, and posts the report from a separate trusted workflow_run job so that no job
running pull-request code holds a write token.

Only instruction counts gate; wall-clock time is reported and never gated.
"""

system_extra = """
tak and this action are pre-v1, and the README says so at the top. Inputs, outputs, the report
