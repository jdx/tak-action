# Local and CI invoke the same tasks, so a laptop and a runner lint the same
# way. Linters are pinned: a new zizmor audit should arrive in a commit that
# bumps it, not as a surprise red build on an unrelated change.
[tools]
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
# Release tooling, used only by the release workflows.
git-cliff = "latest"
gh = "latest"
communique = { version = "latest", minimum_release_age = "0s" }

[tasks.lint]
description = "Run every linter CI runs"
depends = ["lint:*"]

[tasks."lint:actionlint"]
description = "Check workflow syntax and expressions"
run = "actionlint"

[tasks."lint:shellcheck"]
description = "Check the action's shell scripts"
run = "shellcheck --external-sources --source-path=SCRIPTDIR/.. scripts/*.sh scripts/*/*.sh test/*.sh test/fake-tak/tak"

[tasks."lint:zizmor"]
description = "Audit workflows and action.yml for security problems"
run = "zizmor --min-severity=low ."

[tasks.release-plz]
description = "Open or update the release pull request"
run = "./scripts/release/release-plz.sh"
